name: Validate Config

on:
  pull_request:
    paths:
      - "config.yaml"
      - "config.schema.json"
      - "schema/**"
      - "scripts/validate-config.js"
      - ".github/workflows/validate-config.yml"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "config.schema.json"
      - "schema/**"
      - "scripts/validate-config.js"
      - "examples/**"

jobs:
  validate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint schema
        run: npm run lint-schema

      - name: Validate configuration
        run: |
          # Validate main config
          node ./scripts/validate-config.js ./config.yaml
          # Validate each example file
          for f in ./examples/*.yaml; do
            echo "Validating $f"
            node ./scripts/validate-config.js "$f"
          done
