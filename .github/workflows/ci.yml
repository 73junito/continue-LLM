name: CI

on:
  push:
    branches: [ main, ci/validate-examples, security/hono-ci-guard ]
  pull_request:
    branches: [ main, ci/validate-examples, security/hono-ci-guard ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks (secret scan)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: '--path=. --verbose'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high

      - name: Validate YAML/schema
        run: |
          npm run lint-schema
          npm run validate-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests flask pyyaml pytest

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit

      - name: Run unit tests
        run: |
          python -m pytest -q tests/test_parse_heuristics.py

      - name: Start mock Ollama server
        run: |
          nohup python tests/mock_ollama_server.py &
          for i in {1..15}; do
            if curl -sS http://127.0.0.1:11435/health >/dev/null 2>&1; then
              echo "mock up"
              break
            fi
            sleep 1
          done

      - name: Start app server (uvicorn)
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11435
          OLLAMA_MODEL: mistral:7b
        run: |
          nohup uvicorn autolearnpro_agent.server:app --port 8001 &
          for i in {1..15}; do
            if curl -sS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo "app up"
              break
            fi
            sleep 1
          done

      - name: Run integration test against mock
        env:
          CONTINUE_SERVER_URL: http://127.0.0.1:8001/chat
        run: |
          python tests/run_prompt_each_model_test.py
