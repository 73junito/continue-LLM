schema: config.schema.json
name: Local Config
version: 1.0.0

models:
  - id: explanation
    name: Llama3
    description: 'General-purpose reasoning, summarization, and explanations.'
    provider: ollama
    model: mistral:7b
    apiBase: 'http://127.0.0.1:11435'

  - id: coding
    name: StarCoder2.3b
    description: 'Code generation, editing, and developer-focused tasks.'
    provider: ollama
    model: qwen3:1.7b
    apiBase: 'http://127.0.0.1:11435'

  - id: mistral-7b
    name: Mistral 7B
    description: 'General-purpose local Mistral model for text generation.'
    provider: ollama
    model: mistral:7b
    apiBase: 'http://127.0.0.1:11435'

  - id: qwen3-1.7b
    name: Qwen3 1.7B
    description: 'Local Qwen3 1.7B model for text generation and reasoning.'
    provider: ollama
    model: qwen3:1.7b
    apiBase: 'http://127.0.0.1:11435'

  - id: qwen2-math-1.5b
    name: Qwen2-Math 1.5B
    description: 'Local Qwen2 1.5B model optimized for math reasoning.'
    provider: ollama
    model: qwen2-math:1.5b
    apiBase: 'http://127.0.0.1:11435'

routes:
  - match: '(explain|explanation|summary|summarize|describe|why|how)'
    model: explanation

  - match: '(code|implement|fix|refactor|patch|function|class|compile|error)'
    model: coding

  - match: '(autocomplete|complete|suggest)'
    model: coding

defaults:
  timeout_seconds: 120
  max_tokens: 8192

 
